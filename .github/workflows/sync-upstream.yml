name: Sync upstream

# Keeps this fork in sync with attendee-labs/attendee.
# Runs weekly (and on demand). Attempts to merge upstream/main into our main:
#   - clean merge   -> pushes a branch and opens a PR (review + CI, then merge = deploy)
#   - conflicts     -> opens an issue listing the conflicted files for manual resolution
# It never pushes to main directly, because main auto-deploys to the production bot.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM: https://github.com/attendee-labs/attendee.git
  # Use a PAT (secret SYNC_PAT) so the opened PR triggers CI. Falls back to the
  # built-in token, in which case CI on the PR must be kicked manually.
  GH_TOKEN: ${{ secrets.SYNC_PAT || github.token }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Configure git
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream main

      - name: Check how far behind
        id: check
        run: |
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "Fork is $behind commit(s) behind upstream/main."

      - name: Skip if already open
        id: open
        if: steps.check.outputs.behind != '0'
        run: |
          existing=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("automated/upstream-sync-"))] | length')
          echo "existing=$existing" >> "$GITHUB_OUTPUT"
          if [ "$existing" != "0" ]; then echo "An upstream-sync PR is already open; skipping."; fi

      - name: Attempt merge
        id: merge
        if: steps.check.outputs.behind != '0' && steps.open.outputs.existing == '0'
        run: |
          branch="automated/upstream-sync-$(date -u +%Y%m%d)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -b "$branch"
          if git merge --no-edit upstream/main; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
          fi

      - name: Open PR (clean merge)
        if: steps.merge.outputs.result == 'clean'
        run: |
          git push -u origin "${{ steps.merge.outputs.branch }}"
          gh pr create \
            --base main \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "Sync upstream/main ($(date -u +%Y-%m-%d))" \
            --body "Automated weekly sync of \`upstream/main\` (attendee-labs/attendee). Clean merge, no conflicts. Review CI, then merge to deploy. Generated by \`.github/workflows/sync-upstream.yml\`."

      - name: Open issue (conflicts)
        if: steps.merge.outputs.result == 'conflict'
        run: |
          {
            echo "The weekly upstream sync hit merge conflicts and needs manual resolution."
            echo
            echo "Conflicted files:"
            echo '```'
            cat /tmp/conflicts.txt
            echo '```'
            echo
            echo "To resolve locally:"
            echo '```'
            echo "git fetch upstream && git checkout -b automated/upstream-sync-manual main"
            echo "git merge upstream/main   # resolve conflicts, commit, push, open PR"
            echo '```'
          } > /tmp/issue.md
          gh issue create \
            --title "Upstream sync needs manual conflict resolution ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/issue.md \
            --label "upstream-sync" || \
          gh issue create \
            --title "Upstream sync needs manual conflict resolution ($(date -u +%Y-%m-%d))" \
            --body-file /tmp/issue.md
